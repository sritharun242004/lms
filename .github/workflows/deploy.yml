name: Deploy CMS to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 505467908612.dkr.ecr.us-east-1.amazonaws.com
  WEB_REPO: lms-web
  REALTIME_REPO: lms-realtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build + push web image
        run: |
          docker build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_APP_URL=https://www.thexintelligence.ai \
            --build-arg NEXT_PUBLIC_SOCKET_URL=https://xrvfqcwgae.us-east-1.awsapprunner.com \
            -t $ECR_REGISTRY/$WEB_REPO:${{ steps.tag.outputs.image_tag }} \
            -t $ECR_REGISTRY/$WEB_REPO:latest .
          docker push $ECR_REGISTRY/$WEB_REPO:${{ steps.tag.outputs.image_tag }}
          docker push $ECR_REGISTRY/$WEB_REPO:latest

      - name: Build + push realtime image
        run: |
          docker build -f Dockerfile.realtime \
            -t $ECR_REGISTRY/$REALTIME_REPO:${{ steps.tag.outputs.image_tag }} \
            -t $ECR_REGISTRY/$REALTIME_REPO:latest .
          docker push $ECR_REGISTRY/$REALTIME_REPO:${{ steps.tag.outputs.image_tag }}
          docker push $ECR_REGISTRY/$REALTIME_REPO:latest

  redeploy-app-runner:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pin services to the released images
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          update_service() {
            local service_name="$1"
            local repository="$2"
            local start_command="${3:-}"
            local arn
            arn=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$service_name'].ServiceArn | [0]" --output text)

            if [ "$arn" = "None" ] || [ -z "$arn" ]; then
              echo "App Runner service not found: $service_name" >&2
              return 1
            fi

            aws apprunner describe-service --service-arn "$arn" --query 'Service.SourceConfiguration' --output json > source-configuration.json

            if [ -n "$start_command" ]; then
              jq --arg image "$ECR_REGISTRY/$repository:$IMAGE_TAG" --arg command "$start_command" \
                '.ImageRepository.ImageIdentifier = $image | .ImageRepository.ImageConfiguration.StartCommand = $command' \
                source-configuration.json > updated-source-configuration.json
            else
              jq --arg image "$ECR_REGISTRY/$repository:$IMAGE_TAG" \
                '.ImageRepository.ImageIdentifier = $image' \
                source-configuration.json > updated-source-configuration.json
            fi

            aws apprunner update-service --service-arn "$arn" --source-configuration file://updated-source-configuration.json
          }

          update_service lms-web "$WEB_REPO" 'npx --no-install next start'
          update_service lms-realtime "$REALTIME_REPO"
